# Turnkey Matchmaker: backend (FastAPI + agents) + frontend (Next.js).
#
#   cp backend/.env.example backend/.env    # add VEXCEL_API_KEY (optional: demo/OSM mode without it)
#   docker compose up --build               # http://localhost:3000
#
# LLM: by default the backend uses Ollama running on your HOST (fast, uses the GPU on Macs).
# To run Ollama in Docker instead (CPU-only on Macs, slow):
#   OLLAMA_BASE_URL=http://ollama:11434 docker compose --profile ollama up --build
# See INSTALLATION.md for details.

name: turnkey-matchmaker

services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Inside a container "localhost" is the container itself, so point at the host's Ollama.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DATABASE_PATH: /data/turnkey.db
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes host.docker.internal work on Linux too
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - turnkey-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend through the published host port.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional containerized Ollama (enable with --profile ollama).
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # One-shot: pulls the model into the containerized Ollama, then exits.
  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen3:8b}"]
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"

volumes:
  turnkey-data:
  ollama-models:
