# Turnkey Matchmaker: backend (FastAPI + agents) + frontend (Next.js).
#
#   codex login                              # once, on this machine (or use the ChatGPT/Codex app)
#   cp backend/.env.example backend/.env     # add VEXCEL_API_KEY (optional: OSM-only mode without it)
#   docker compose up --build                # http://localhost:3000
#
# LLM: the backend image contains the Codex CLI and uses YOUR Codex login, mounted from ~/.codex
# (override with CODEX_HOME_DIR=/path). Codex refreshes its login token in that folder, so the mount is
# read-write. See INSTALLATION.md.

name: turnkey-matchmaker

services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /data/turnkey.db
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      CODEX_HOME: /codex-home
      CODEX_BIN: codex   # the Linux CLI inside the image (a host CODEX_BIN path would not exist here)
    volumes:
      - turnkey-data:/data
      - ${CODEX_HOME_DIR:-~/.codex}:/codex-home
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend through the published host port.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  turnkey-data:
