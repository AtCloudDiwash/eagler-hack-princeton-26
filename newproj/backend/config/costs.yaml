# Deterministic cost engine inputs (services/costs.py). Ranges, not quotes.
# All dollar figures are PLANNING ASSUMPTIONS (rule-of-thumb bands), not listing or contractor data.
# The Cost Agent chooses which adders apply and must cite the evidence that triggered each one.

disclaimer: >-
  Preliminary ranges from fixed planning bands, not contractor quotes or listing rents. Actual costs
  vary with site conditions, finishes, landlord concessions and local labor rates.

# Asking rent bands, USD per sq ft per year (NNN), by city key and use. Used only when no listing rent
# is available (CoStar listing data is not connected in this build).
rent_bands:
  houston-tx:
    restaurant: {low: 22, high: 40}
    medical_office: {low: 22, high: 36}
    gym: {low: 14, high: 26}
    office: {low: 24, high: 42}
    retail: {low: 20, high: 38}
    source: "Planning assumption for Houston (not listing data); replace with CoStar asking rent when connected"
  los-angeles-ca:
    restaurant: {low: 36, high: 72}
    medical_office: {low: 36, high: 60}
    gym: {low: 24, high: 42}
    office: {low: 36, high: 60}
    retail: {low: 36, high: 72}
    source: "Planning assumption for Los Angeles (not listing data)"
  _default:
    restaurant: {low: 20, high: 45}
    medical_office: {low: 20, high: 40}
    gym: {low: 12, high: 28}
    office: {low: 20, high: 45}
    retail: {low: 18, high: 42}
    source: "National planning assumption (not listing data)"

nnn_per_sqft_year: {low: 7, high: 12}   # taxes, insurance, CAM

# Base tenant fit-out per sq ft (shell -> open), before adders. Second-generation space (same prior use)
# usually sits at the low end; first-generation shell at the high end.
base_fitout_per_sqft:
  restaurant: {low: 75, high: 175}
  medical_office: {low: 90, high: 200}
  gym: {low: 25, high: 70}
  office: {low: 30, high: 90}
  retail: {low: 30, high: 90}

# Adders the Cost Agent can apply. unit: each | per_sqft. applies_to limits which uses may add them.
adders:
  hood_exhaust:
    label: Kitchen exhaust hood + fire suppression
    unit: each
    low: 15000
    high: 30000
    applies_to: [restaurant]
  grease_interceptor:
    label: Grease interceptor (in-ground)
    unit: each
    low: 8000
    high: 20000
    applies_to: [restaurant]
  hvac_rtu:
    label: New rooftop HVAC unit(s)
    unit: each            # quantity = units needed
    low: 15000
    high: 25000
    applies_to: [restaurant, medical_office, gym, office, retail]
  roof_repair:
    label: Roof repair / recoat (tenant share)
    unit: per_sqft
    low: 4
    high: 9
    applies_to: [restaurant, medical_office, gym, office, retail]
  electrical_upgrade:
    label: Electrical service / panel upgrade
    unit: each
    low: 10000
    high: 25000
    applies_to: [restaurant, medical_office, gym]
  operatory_plumbing:
    label: Plumb treatment rooms (water, vacuum, air) per operatory
    unit: each
    low: 5000
    high: 8000
    applies_to: [medical_office]
  ada_upgrades:
    label: ADA entrance / restroom upgrades
    unit: each
    low: 5000
    high: 25000
    applies_to: [restaurant, medical_office, gym, office, retail]
  restroom_add:
    label: Additional restroom
    unit: each
    low: 10000
    high: 15000
    applies_to: [restaurant, medical_office, gym, retail]
  rubber_flooring:
    label: Impact flooring for free-weight areas
    unit: per_sqft
    low: 4
    high: 10
    applies_to: [gym]
  locker_showers:
    label: Locker rooms with showers
    unit: each
    low: 40000
    high: 90000
    applies_to: [gym]
  parking_agreement:
    label: Shared-parking agreement / variance process (first year)
    unit: each
    low: 5000
    high: 30000
    applies_to: [restaurant, medical_office, gym, office, retail]

soft_costs:
  permits_fees: {low: 5000, high: 15000}
  contingency_pct: {low: 0.10, high: 0.20}

lease:
  amortize_fitout_years: 10   # tenant-paid fit-out spread over a typical term for the monthly view
  deposit_months: 2           # upfront security deposit, months of rent

# Typical budgets used to judge whether costs are "within range" (occupancy_cost metric).
typical_upfront_per_sqft:
  restaurant: {good: 150, high: 275}
  medical_office: {good: 170, high: 300}
  gym: {good: 60, high: 120}
  office: {good: 70, high: 140}
  retail: {good: 70, high: 140}
