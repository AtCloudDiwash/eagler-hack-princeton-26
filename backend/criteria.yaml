# Criteria registry — the single place that decides what gets scored and how much it matters.
#
# Add or re-weight criteria here; no core code changes are needed unless you introduce a new
# `evaluator` name (then register one function in app/services/evaluators.py).
# The file is re-read automatically when it changes, so weight edits apply on the next request.
#
# Field reference (full spec: docs/CRITERIA_REGISTRY.md)
#   weight               relative importance; 0 = evaluated and shown but not scored
#   hard_block           disqualify the property when the evaluator reports a definitive failure.
#                        Missing data NEVER triggers a hard block.
#   missing_data_policy  assume_risk  -> UNKNOWN, scored as 0
#                        assume_cost  -> UNKNOWN, scored as 0, and the evaluator's fallback cost is added
#                        unknown      -> UNKNOWN, excluded from the score (also accepted: "ignore")
#   evidence_required    a PASS needs at least one observed fact (listing / Matterport / Vexcel)
#   business_types       business types this applies to (["ALL"] = every type)
#   applicable_jurisdictions  ["ALL"], a state code ("TX") or a city ("Austin")

# zoning_use: no required_inputs on purpose — a no-zoning city (jurisdictions.yaml `zoning_mode: none`,
# e.g. Houston) has no zoning code to require; the evaluator reports a missing code as UNKNOWN itself.
# The city-specific citation comes from the jurisdiction's `zoning_source`.
- id: "zoning_use"
  description: "Zoning / land-use rules and recorded use restrictions permit this business use"
  domain: "regulatory"
  weight: 10
  hard_block: true
  evaluator: "zoning_checker"
  required_inputs: []
  missing_data_policy: "unknown"
  evidence_required: true
  source: "Local zoning / land-use rules for the property's city (citation per jurisdiction)"
  thresholds: {}
  business_types: ["ALL"]
  applicable_jurisdictions: ["ALL"]

- id: "parking_sufficiency"
  description: "Visible parking covers the spaces the business needs"
  domain: "regulatory"
  weight: 10
  hard_block: false
  evaluator: "parking_checker"
  # Space count comes from visible_parking_count (striped spaces) or, failing that, the Vexcel
  # estimated_parking_spaces (omitted when parcel paving is under one space); the evaluator returns
  # UNKNOWN (assume_risk) when neither is known. Spaces needed: the user's number, the city minimum
  # (jurisdictions.yaml parking_ratios; none in market-based areas) or the business guideline.
  # The evaluator cites the jurisdiction's parking rule in place of this generic source.
  required_inputs: ["business_required_parking"]
  missing_data_policy: "assume_risk"
  evidence_required: true
  source: "Business need, or the city's off-street parking minimum where one applies (citation per jurisdiction)"
  thresholds:
    min_ratio: 1.0          # visible / required spaces needed for PASS
    sqft_per_space: 350     # paved sq ft per space when estimating from Vexcel hardscape area
  business_types: ["ALL"]
  applicable_jurisdictions: ["ALL"]

- id: "ada_accessibility"
  description: "Accessible entrance (door clear width, step-free entry)"
  domain: "safety"
  weight: 15
  hard_block: false
  evaluator: "ada_checker"
  required_inputs: ["door_width_inches"]
  missing_data_policy: "assume_risk"
  evidence_required: true
  source: "2010 ADA Standards §404.2.3 (32 in. min clear width)"
  thresholds:
    min_width: 32
  business_types: ["ALL"]
  applicable_jurisdictions: ["ALL"]

