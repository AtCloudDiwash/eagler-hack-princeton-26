# Added via prompts/scale-criteria.md — config only; evaluator `check_window_visibility` in
# app/services/evaluators.py. Below min_area -> RISK (scored 0); no window data -> ignored.
- id: "window_visibility"
  description: "Restaurant windows visible from street"
  domain: "marketing"
  weight: 5
  hard_block: false
  evaluator: "check_window_visibility"
  required_inputs: ["window_area"]
  missing_data_policy: "ignore"
  evidence_required: false
  source: "Business importance (street visibility drives walk-in traffic)"
  thresholds:
    min_area: 10            # sq ft of street-facing glass
  business_types: ["restaurant"]
  applicable_jurisdictions: ["ALL"]

# Vexcel live data: roof condition score (1-5) and roof defects from /property/extract.
# No fixture roof data -> UNKNOWN, excluded from the score.
- id: "roof_condition"
  description: "Roof in fair or better condition with no major defects"
  domain: "space"
  weight: 5
  hard_block: false
  evaluator: "roof_checker"
  required_inputs: ["roof_condition"]
  missing_data_policy: "unknown"
  evidence_required: true
  source: "Vexcel AI roof condition score (1–5) from aerial imagery"
  thresholds:
    min_condition: 3        # PASS needs >= 3 and no tarp / structural damage
  business_types: ["ALL"]
  applicable_jurisdictions: ["ALL"]
