  thresholds: {}
  business_types: ["ALL"]
  applicable_jurisdictions: ["ALL"]

- id: "hvac_capacity"
  description: "Rooftop HVAC capacity covers the expected load"
  domain: "space"
  weight: 10
  hard_block: false
  evaluator: "hvac_checker"
  required_inputs: ["hvac_tons", "required_hvac_tons"]
  missing_data_policy: "assume_risk"
  evidence_required: true
  source: "Rule of thumb: sq ft per ton by business type"
  thresholds:
    tons_per_unit: 5        # also used to turn Vexcel rooftop AC unit counts into tons
    # Vexcel rooftop units are counted for the whole building. When the building footprint is known
    # and larger than the listing, evaluate the suite's share: tons x (size_sqft / footprint).
    prorate_by_footprint: true
  business_types: ["ALL"]
  applicable_jurisdictions: ["ALL"]

