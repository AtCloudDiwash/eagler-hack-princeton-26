# Verified jurisdiction rules for the Compliance Agent. The agent may only cite what is here (or
# report "unknown" with the official place to check). Never add a rule without an official source.
# Houston entries were researched Nov 2026 (see notes); re-verify before relying on them.
#
#   match            how a reverse-geocoded address maps to this entry (city + state)
#   zoning_mode      none | districts | unverified
#   permitted_use    per zoning_use: {status: pass|risk|fail|unknown, detail, citation, url}
#   parking          {minimums: bool, ratios: {zoning_use: spaces per 1,000 sq ft GFA}, citation, url,
#                     exempt_areas: [{name, polygon [[lon, lat], ...], citation}]}
#   requirements     per zoning_use (or "all"): list of {id, rule, detail, citation, url}

houston-tx:
  name: Houston, TX
  match: {city: [houston], state: [texas, tx]}
  zoning_mode: none
  permitted_use:
    _default:
      status: pass
      detail: >-
        Houston has no zoning ordinance, so no zoning approval is needed for this use. Recorded deed
        restrictions (enforced by the City) and lease/shopping-center use clauses can still prohibit it
        and must be checked for this parcel.
      citation: "Houston Code of Ordinances Ch. 10, Art. XV, §§10-551–10-555 (deed restriction enforcement)"
      url: https://www.houstontx.gov/legal/deed.html
  parking:
    minimums: true
    ratios: {restaurant: 10.0, medical_office: 3.5}
    unverified_uses_note: >-
      The ratio for this use was not verified in our rule set; look it up in the §26-492 use-class table.
    citation: "Houston Code Ch. 26, Art. VIII, §26-492 (Ord. 2013-208)"
    url: https://www.houstontx.gov/planning/DevelopRegs/docs_pdfs/Requirements%20for%20Use%20Classifications.pdf
    exempt_areas:
      - name: Downtown market-based parking area
        citation: "Houston Code Ch. 26, §26-471 (market-based parking area)"
        polygon: [[-95.3700, 29.7500], [-95.3600, 29.7500], [-95.3600, 29.7640], [-95.3700, 29.7640]]
      - name: East Downtown (EaDo) market-based parking area
        citation: "Houston Code Ch. 26, §26-471 as amended by Ord. 2019-0540"
        polygon: [[-95.3565, 29.7450], [-95.3460, 29.7450], [-95.3460, 29.7590], [-95.3565, 29.7590]]
    exempt_note: >-
      Exempt-area polygons are conservative inner approximations of the official map; a site just
      outside them may still be exempt.
  flood:
    sfha: >-
      Inside a FEMA Special Flood Hazard Area (about a 1% yearly flood chance). Houston's floodplain rules
      (Code Ch. 19, amended 2018 after Harvey) require new construction and substantial improvements to be
      elevated above the 500-year flood level; federally backed loans require flood insurance. A typical tenant
      fit-out is not a "substantial improvement", but confirm with the Houston Permitting Center and budget for insurance.
    moderate: >-
      In the 500-year (0.2% yearly) floodplain. Houston's 2018 floodplain rules also cover the 500-year floodplain for
      new construction and substantial improvements; flood insurance is optional but often advisable here.
    minimal: "Area of minimal flood hazard (FEMA zone X): no floodplain construction rules apply."
    citation: "FEMA NFHL flood zone; Houston Code of Ordinances Ch. 19 (Floodplain), amended 2018"
    url: https://www.houstonpermittingcenter.org/
  requirements:
    restaurant:
      - id: health_permit
        rule: Food establishment permit, plan review & pre-opening inspection
        detail: >-
          Houston adopted the FDA Food Code and Texas Food Establishment Rules by reference (effective
          Sept 1, 2025). Plan review, a pre-operational inspection and an annual Food Dealer permit are required.
        citation: "Texas Food Establishment Rules, 25 TAC Ch. 228; Houston Health Department food permits"
        url: https://www.houstonhealth.org/services/permits/food-permits/opening-food-establishment
      - id: grease_interceptor
        rule: Grease interceptor & FOG permit
        detail: >-
          Food service needs a grease interceptor, pumped at least quarterly (§47-512(b)), and an annual
          FOG generator permit.
        citation: "Houston Code Ch. 47, Art. XI; §47-512(b)"
        url: https://www.houstonpermittingcenter.org/
      - id: plumbing_fixtures
        rule: Restroom fixture count
        detail: "2021 Uniform Plumbing Code Table 422.1 (assembly: restaurants), ~2 restrooms for ~46 occupants."
        citation: "2021 UPC with City of Houston amendments (effective Jan 2, 2024), Table 422.1"
        url: https://www.houstonpermittingcenter.org/
    medical_office:
      - id: xray_registration
        rule: Dental X-ray registration
        detail: Dental radiation machines must be registered with the Texas DSHS Radiation Control Program.
        citation: "25 TAC §289.232 (dental radiation machines)"
        url: https://www.dshs.texas.gov/texas-radiation-control
      - id: building_permit_b
        rule: Building permit for medical tenant build-out
        detail: Tenant improvements need a Houston building permit under the Houston Construction Code.
        citation: "2021 International Building Code with City of Houston amendments"
        url: https://www.houstonpermittingcenter.org/
    all:
      - id: ada_tas
        rule: Accessibility (ADA + Texas Accessibility Standards)
        detail: >-
          Public accommodations must meet the 2010 ADA Standards; in Texas, projects over $50,000 also need
          TDLR registration and review under the Texas Accessibility Standards.
        citation: "2010 ADA Standards for Accessible Design; Texas Architectural Barriers Act / TAS (TDLR)"
        url: https://www.tdlr.texas.gov/ab/abtas.htm
      - id: certificate_occupancy
        rule: Certificate of Occupancy for change of use
        detail: A change of occupancy (e.g., retail to restaurant) needs a new Certificate of Occupancy.
        citation: "Houston Construction Code; Houston Permitting Center"
        url: https://www.houstonpermittingcenter.org/

los-angeles-ca:
  name: Los Angeles, CA
  match: {city: [los angeles], state: [california, ca]}
  zoning_mode: unverified
  permitted_use:
    _default:
      status: unknown
      detail: >-
        Los Angeles uses zoning districts. The parcel's zone and whether this use is permitted were not
        verified; look the parcel up in ZIMAS and check the LAMC use list for that zone.
      citation: "Los Angeles Municipal Code Chapter 1 (Planning & Zoning); ZIMAS parcel lookup"
      url: https://zimas.lacity.org/
  parking:
    minimums: unknown
    ratios: {}
    unverified_uses_note: >-
      LA parking rules vary by zone and by AB 2097 transit proximity; not verified in our rule set.
    citation: "LAMC §12.21 A.4; California AB 2097 (2022)"
    url: https://zimas.lacity.org/
    exempt_areas: []
  flood:
    sfha: >-
      Inside a FEMA Special Flood Hazard Area: federally backed loans require flood insurance (National Flood
      Insurance Program) and Los Angeles floodplain rules apply to substantial improvements (not verified in our rule set).
    moderate: "In the 500-year (0.2% yearly) floodplain: flood insurance is optional but often advisable."
    minimal: "Area of minimal flood hazard (FEMA zone X)."
    citation: "FEMA National Flood Hazard Layer; National Flood Insurance Program"
    url: https://msc.fema.gov/portal/home
  requirements:
    all:
      - id: ada_cbc11b
        rule: Accessibility (ADA + California Building Code Ch. 11B)
        detail: Public accommodations must meet the 2010 ADA Standards and CBC Chapter 11B.
        citation: "2010 ADA Standards; California Building Code Chapter 11B"
        url: https://www.ada.gov/law-and-regs/design-standards/2010-stds/

_default:
  name: Unverified jurisdiction
  zoning_mode: unverified
  permitted_use:
    _default:
      status: unknown
      detail: >-
        This location is not in our verified rule set. Ask the local planning/zoning office (or check the
        municipal code) whether this use is permitted in the parcel's district.
      citation: null
      url: null
  parking:
    minimums: unknown
    ratios: {}
    unverified_uses_note: Parking minimums for this city were not verified.
    citation: null
    url: null
    exempt_areas: []
  flood:
    sfha: >-
      Inside a FEMA Special Flood Hazard Area (about a 1% yearly flood chance): federally backed loans require flood
      insurance (National Flood Insurance Program) and local floodplain rules apply to substantial improvements.
    moderate: "In the 500-year (0.2% yearly) floodplain: flood insurance is optional but often advisable."
    minimal: "Area of minimal flood hazard (FEMA zone X)."
    citation: "FEMA National Flood Hazard Layer; National Flood Insurance Program"
    url: https://msc.fema.gov/portal/home
  requirements:
    all:
      - id: ada
        rule: Accessibility (ADA)
        detail: Public accommodations must meet the 2010 ADA Standards for Accessible Design.
        citation: "2010 ADA Standards for Accessible Design (28 CFR Part 36)"
        url: https://www.ada.gov/law-and-regs/design-standards/2010-stds/
