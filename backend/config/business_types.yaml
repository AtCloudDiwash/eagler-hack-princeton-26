# Business types. Each picks its metrics (with weights and a business-specific reason), its
# neighborhood catchment, the place groups the Neighborhood Agent should care about and sizing.
# Add a business type by adding an entry here; no code changes needed.
#
#   keywords             words that identify the business in a query (rules parser + LLM hint)
#   zoning_use           key used in jurisdictions.yaml rules
#   sizing               sqft_per_seat (whole space incl. kitchen/back of house), default size,
#                        ideal_min/ideal_max sqft for the usable space
#   suitable_building_types / acceptable_building_types   Vexcel building-type.class values
#   costar_property_types  CoStar propertyType names whose listed spaces can host this use
#   default_radius_m, radius_reason   catchment used for neighborhood analysis
#   place_roles          which place groups (place_groups.yaml) mean demand / competition / access
#   program              what the user's request implies (services/program.py):
#     drivers            counts in the request that size the space: field, label, keywords, sqft_each,
#                        base_sqft, why. The first driver the user gives a number for sets the size.
#     concepts           kinds of this business that size differently (services/sizing.py). Each has an id,
#                        label, keywords (found in the query; the one marked default otherwise) and:
#                          sqft_per: {driver field: [low, typical, high]} front-of-house sq ft per unit
#                          base_sqft / base_label: fixed space on top (counter and queue, lobby, reception)
#                          back_of_house_share: kitchen/storage/restroom share of the total (restaurants)
#                          default_count: {driver field: n} assumed when the request gives no count
#                          default_sqft: [low, typical, high] when no driver applies (retail)
#                          unit_label: what the counted unit is called for this concept ("exam rooms")
#                        The band is the low..high estimate; the size fit scores spaces against it.
#     occupancy          IBC occupancy group (config/occupancy_codes.yaml), optional small_group used
#                        below 50 occupants (IBC §303.1.1), load_factors: share of floor area by function
#                        and its sq ft per person (IBC Table 1004.5)
#     ground_floor       required | preferred | any
#     min_ceiling_ft     planning threshold, with ceiling_reason
#     buildout_months    typical [low, high] months from lease signing to opening
#   metrics              metric id -> {weight, why}

restaurant:
  label: Restaurant
  icon: utensils
  keywords: [restaurant, cafe, café, diner, bistro, eatery, bar, pub, brewery, taproom, pizzeria, bakery, coffee shop, coffee, taqueria, food]
  zoning_use: restaurant
  sizing: {sqft_per_seat: 35, default_seats: 40, ideal_min_sqft: 1200, ideal_max_sqft: 4500}
  program:
    drivers:
      - {field: seats, label: seats, keywords: [seat, seats, seater, cover, covers, guest, guests, diner, diners], sqft_each: 35, base_sqft: 0, why: "~35 sq ft per seat covers dining, kitchen, restrooms and storage"}
    concepts:
      - id: full_service
        label: full-service restaurant
        default: true
        keywords: [full service, full-service, sit-down, sit down, restaurant, bistro, diner, eatery, brasserie, trattoria]
        sqft_per: {seats: [15, 18, 21]}
        base_sqft: 150
        base_label: host stand, waiting area and server stations
        back_of_house_share: 0.38
        default_count: {seats: 40}
        why: "Table service: 15-21 sq ft of dining room per seat; the kitchen, dish, storage and restrooms take ~35-40% of the space."
      - id: coffee_shop
        label: coffee shop / café
        keywords: [coffee shop, coffee, café, cafe, espresso, tea house, tea shop, juice bar, boba, smoothie, dessert, ice cream, gelato]
        sqft_per: {seats: [16, 18, 20]}
        base_sqft: 300
        base_label: order counter, queue and pickup
        back_of_house_share: 0.25
        default_count: {seats: 25}
        why: "Counter service with a small prep area: the counter and queue take a fixed ~300 sq ft; back of house is ~25%."
      - id: counter_service
        label: fast-casual / counter-service restaurant
        keywords: [fast casual, fast-casual, counter service, quick service, quick-service, fast food, takeout, take-out, takeaway, sandwich, burger, taqueria, pizzeria, pizza, food hall]
        sqft_per: {seats: [12, 14, 16]}
        base_sqft: 200
        base_label: order counter, queue and pickup
        back_of_house_share: 0.35
        default_count: {seats: 40}
        why: "Counter ordering packs seats tighter (12-16 sq ft each); the kitchen is ~35% of the space."
      - id: fine_dining
        label: fine-dining restaurant
        keywords: [fine dining, fine-dining, upscale, tasting menu, white tablecloth, steakhouse, omakase, chef's table]
        sqft_per: {seats: [20, 24, 28]}
        base_sqft: 250
        base_label: host stand, lounge and server stations
        back_of_house_share: 0.42
        default_count: {seats: 50}
        why: "Generous table spacing (20-28 sq ft per seat) and a larger kitchen (~40%) for plated, multi-course service."
      - id: bar
        label: bar / taproom
        keywords: [bar, pub, brewery, brewpub, taproom, tap room, lounge, wine bar, cocktail, tavern, speakeasy]
        sqft_per: {seats: [12, 15, 18]}
        base_sqft: 350
        base_label: bar counter and back bar
        back_of_house_share: 0.2
        default_count: {seats: 60}
        why: "Standing room and the bar itself take space; back of house (storage, cooler, small kitchen) is ~20%."
      - id: bakery
        label: bakery
        keywords: [bakery, patisserie, pastry, donut, doughnut, bagel]
        sqft_per: {seats: [15, 18, 20]}
        base_sqft: 300
        base_label: display case and counter
        back_of_house_share: 0.55
        default_count: {seats: 12}
        why: "Production (ovens, mixers, proofing, storage) takes over half the space; seating is a small café area."
    occupancy:
      group: A-2
      small_group: B
      load_factors:
        - {label: dining area, share: 0.6, sqft_per_person: 15}
        - {label: kitchen and back of house, share: 0.4, sqft_per_person: 200}
    ground_floor: required
    min_ceiling_ft: 10
    ceiling_reason: Hood exhaust ducts and makeup air need room above the kitchen ceiling.
    buildout_months: [4, 8]
  suitable_building_types: [commercial]
  costar_property_types: [GeneralRetail, MixedUse, Flex, Office, SportsAndEntertainment, Specialty]  # CoStar propertyType names that can host this use
  acceptable_building_types: [multiple_family, condo_apartment]
  default_radius_m: 500
  radius_reason: >-
    Restaurants live on walk-in and short-trip customers, so competition and foot traffic within a
    ~6-minute walk (about 500 m) matter most.
  place_roles:
    competitors: [food_drink]
    demand: [offices, lodging, education, entertainment, retail]
    access: [transit, parking]
  neighborhood:
    # Situational signals: only these extra tools are offered to the Neighborhood agent for this business.
    signals: [daytime_workers, residents, competitors, walk_access]
    competitors: {match: {amenity: [restaurant, fast_food, cafe, food_court]}, kind_by: cuisine}
    # Planning heuristics at the default catchment radius (scaled by area for other radii). Not market data.
    benchmarks: {daytime_workers: {strong: 8000, weak: 1500}, employed_residents: {strong: 3000, weak: 600}}
  metrics:
    occupancy_requirements: {weight: 5, why: "Seats and staff set the occupancy class: 50+ people means assembly rules (two exits, more restrooms) and 100+ means sprinklers."}
    permitted_use: {weight: 14, why: "A restaurant needs food-service use allowed at the address before anything else matters."}
    hvac_ventilation: {weight: 13, why: "Commercial kitchens need a hood exhaust path to the roof and extra HVAC capacity; retrofitting both is one of the biggest restaurant build-out costs."}
    customer_demand: {weight: 12, why: "Covers per day drive restaurant revenue; offices, hotels and residents within walking distance supply them."}
    size_fit: {weight: 11, why: "Seats, kitchen and restrooms need roughly 30-40 sq ft per seat."}
    occupancy_cost: {weight: 12, why: "Restaurants typically keep occupancy cost under ~6-10% of sales; build-out is often the largest upfront cost."}
    parking_requirement: {weight: 8, why: "Restaurant parking minimums are among the highest of any use; a shortfall can block permits outside exempt areas."}
    health_permitting: {weight: 8, why: "Health plan review, a grease interceptor and food permits are mandatory before opening."}
    building_condition: {weight: 7, why: "Roof leaks over a kitchen or dining room are costly and can fail health inspection."}
    competition: {weight: 6, why: "A food cluster draws diners, but too many direct competitors split demand."}
    accessibility_transit: {weight: 5, why: "Easy access widens the lunch and dinner catchment."}
    accessibility_ada: {weight: 4, why: "Dining rooms and restrooms must be accessible to the public."}
    onsite_parking: {weight: 4, why: "Drive-in diners need somewhere to park."}
    kitchen_infrastructure: {weight: 6, why: "An existing hood and grease interceptor can save $50k+ in build-out."}
    interior_layout: {weight: 3, why: "Dining-room and kitchen layout drive seat count and workflow."}
    conversion_risk: {weight: 4, why: "Unknown kitchen and HVAC conditions are the usual source of restaurant budget overruns."}
    area_character: {weight: 3, why: "Commercial, mixed-use streets support restaurant traffic."}
    flood_risk: {weight: 4, why: "Flooding can shut a kitchen for months; flood zones add insurance cost and rules for major work."}
    evidence_quality: {weight: 0, why: "Shown for transparency; drives confidence, not the score."}

dental_clinic:
  label: Dental clinic
  icon: tooth
  keywords: [dental office, dental practice, dental, dentist, orthodontist, clinic, medical office, medical practice, doctor, physician, medical, healthcare]
  zoning_use: medical_office
  sizing: {sqft_per_seat: 0, default_sqft: 2200, ideal_min_sqft: 1500, ideal_max_sqft: 4000}
  program:
    drivers:
      - {field: chairs, label: operatories, keywords: [chair, chairs, operatory, operatories, treatment room, treatment rooms, exam room, exam rooms, op, ops], sqft_each: 400, base_sqft: 400, why: "~400 sq ft per operatory including its share of sterilization, lab and corridors, plus ~400 sq ft of reception and office"}
    concepts:
      - id: dental
        label: dental practice
        default: true
        keywords: [dental, dentist, orthodontist, orthodontic, endodontist, periodontist, oral surgeon]
        sqft_per: {chairs: [350, 400, 450]}
        base_sqft: 400
        base_label: reception, waiting and office
        default_count: {chairs: 4}
        why: "Each operatory carries its share of sterilization, lab, x-ray and corridors."
      - id: medical_clinic
        label: medical clinic
        keywords: [clinic, medical office, medical practice, medical, doctor, physician, primary care, urgent care, pediatric, pediatrician, chiropractor, physical therapy, therapist]
        unit_label: exam rooms
        sqft_per: {chairs: [250, 300, 350]}
        base_sqft: 600
        base_label: reception, waiting, nurse station and office
        default_count: {chairs: 5}
        why: "Exam rooms are ~100-120 sq ft each; with charting, corridors and a lab each room carries ~250-350 sq ft."
    occupancy:
      group: B
      load_factors:
        - {label: clinic, share: 1.0, sqft_per_person: 150}
    ground_floor: preferred
    min_ceiling_ft: 9
    ceiling_reason: Standard clinic ceilings fit operatory lights and ducts.
    buildout_months: [3, 6]
  suitable_building_types: [commercial]
  costar_property_types: [Office, Healthcare, GeneralRetail, MixedUse, Flex]  # CoStar propertyType names that can host this use
  acceptable_building_types: [multiple_family, condo_apartment]
  default_radius_m: 1500
  radius_reason: >-
    Patients usually choose a dentist within a short drive of home or work, so a ~1.5 km catchment
    shows residential density and competing practices.
  place_roles:
    competitors: [dental_medical]
    demand: [residential_services, retail, offices, education]
    access: [parking, transit]
  neighborhood:
    signals: [residents, competitors]
    competitors: {match: {amenity: [dentist], healthcare: [dentist]}}
    benchmarks: {employed_residents: {strong: 10000, weak: 2500}, daytime_workers: {strong: 15000, weak: 3000}}
  metrics:
    occupancy_requirements: {weight: 4, why: "Operatory count drives restroom, exit and accessibility needs for patients."}
    permitted_use: {weight: 14, why: "Medical/dental use must be allowed (clinic class) at the address."}
    medical_infrastructure: {weight: 13, why: "Operatories need sinks at every chair, vacuum/compressed air and dedicated circuits; retrofits are expensive."}
    accessibility_ada: {weight: 10, why: "Patients include elderly and mobility-impaired people; accessible entry, restrooms and parking are essential."}
    customer_demand: {weight: 11, why: "A practice needs roughly 1,500-2,000 residents or workers per dentist nearby."}
    size_fit: {weight: 10, why: "A 4-6 operatory practice typically needs 1,500-3,000 sq ft."}
    occupancy_cost: {weight: 11, why: "Medical fit-outs cost more per sq ft than offices; rent plus build-out must fit practice economics."}
    parking_requirement: {weight: 7, why: "Clinics have parking minimums in many cities."}
    onsite_parking: {weight: 6, why: "Most patients drive and expect convenient parking."}
    competition: {weight: 6, why: "Nearby practices compete for the same patients."}
    building_condition: {weight: 5, why: "Leaks and roof problems threaten sterile areas and equipment."}
    accessibility_transit: {weight: 3, why: "Transit helps staff and some patients."}
    interior_layout: {weight: 4, why: "Corridors and room sizes determine operatory count."}
    conversion_risk: {weight: 4, why: "Plumbing in slab is the classic dental budget surprise."}
    area_character: {weight: 3, why: "Residential and retail mix supports patient visits."}
    flood_risk: {weight: 4, why: "Flood damage to clinical equipment is costly; flood zones add insurance cost and rules for major work."}
    evidence_quality: {weight: 0, why: "Shown for transparency; drives confidence, not the score."}

gym:
  label: Gym / fitness studio
  icon: dumbbell
  keywords: [gym, fitness, crossfit, yoga, pilates, studio, boxing, martial arts]
  zoning_use: gym
  sizing: {sqft_per_seat: 0, default_sqft: 5000, ideal_min_sqft: 2500, ideal_max_sqft: 15000}
  program:
    drivers:
      - {field: class_size, label: people per class, keywords: [classes of, class of, person classes, person class, people per class, per class, class size, students per class], sqft_each: 50, base_sqft: 600, why: "~50 sq ft per person in an exercise room (the code's occupant load factor) plus ~600 sq ft of lobby, lockers and office"}
      - {field: members, label: members, keywords: [member, members, membership], sqft_each: 10, base_sqft: 0, why: "~10 sq ft per member is a common club planning rule of thumb"}
    concepts:
      - id: full_gym
        label: gym / fitness center
        default: true
        keywords: [gym, fitness center, fitness centre, health club, 24-hour, 24 hour]
        sqft_per: {class_size: [50, 60, 70], members: [8, 10, 13]}
        base_sqft: 600
        base_label: lobby, lockers and office
        default_count: {members: 600}
        why: "Equipment floor, free weights and locker rooms; clubs plan ~8-13 sq ft per member."
      - id: studio
        label: boutique studio (yoga, pilates, barre, spin)
        keywords: [yoga, pilates, barre, spin, cycling, dance, meditation, stretch, studio]
        sqft_per: {class_size: [40, 50, 60], members: [5, 6, 8]}
        base_sqft: 600
        base_label: lobby, cubbies, restrooms and office
        default_count: {class_size: 20}
        why: "One studio room at ~40-60 sq ft per person (the code allows 50) plus a small lobby."
      - id: functional
        label: functional training / boutique gym
        keywords: [crossfit, boutique gym, boutique fitness, functional, hiit, bootcamp, boot camp, boxing, martial arts, mma, jiu jitsu, karate, personal training]
        sqft_per: {class_size: [80, 100, 130], members: [8, 10, 12]}
        base_sqft: 700
        base_label: lobby, lockers and office
        default_count: {class_size: 20}
        why: "Rigs, rowers and open floor for movement need ~80-130 sq ft per athlete per class."
    occupancy:
      group: A-3
      small_group: B
      load_factors:
        - {label: exercise floor, share: 1.0, sqft_per_person: 50}
    ground_floor: preferred
    min_ceiling_ft: 12
    ceiling_reason: Overhead lifts, rigs and jump work need 12+ ft clear; dropped weights favour slab-on-grade floors.
    buildout_months: [3, 6]
  suitable_building_types: [commercial]
  costar_property_types: [Flex, Industrial, GeneralRetail, MixedUse, SportsAndEntertainment, Office]  # CoStar propertyType names that can host this use
  acceptable_building_types: []
  default_radius_m: 1200
  radius_reason: >-
    Members pick a gym within a few minutes of home or work; ~1.2 km shows residents, offices and
    competing gyms in that habit radius.
  place_roles:
    competitors: [fitness]
    demand: [residential_services, offices, education, retail]
    access: [parking, transit]
  neighborhood:
    signals: [residents, daytime_workers, competitors]
    competitors: {match: {leisure: [fitness_centre, sports_centre]}}
    benchmarks: {employed_residents: {strong: 8000, weak: 2000}, daytime_workers: {strong: 10000, weak: 2000}}
  metrics:
    occupancy_requirements: {weight: 5, why: "Class size and floor area set the occupant load: 50+ people means assembly rules, two exits and more restrooms."}
    size_fit: {weight: 14, why: "Equipment floors and classes need large, open floor area."}
    structural_floor: {weight: 13, why: "Dropped weights and impact need a ground-floor slab, ideally with tall clear height."}
    permitted_use: {weight: 12, why: "Recreation/assembly use must be allowed at the address."}
    customer_demand: {weight: 12, why: "Membership depends on residents and workers within a short trip."}
    occupancy_cost: {weight: 11, why: "Gyms lease large areas, so rent per sq ft dominates the economics."}
    onsite_parking: {weight: 8, why: "Peak-hour members arrive by car in most US cities."}
    competition: {weight: 7, why: "Nearby gyms compete on price and convenience."}
    hvac_ventilation: {weight: 6, why: "High occupancy and exertion need strong cooling and ventilation."}
    area_character: {weight: 5, why: "Noise and late hours fit commercial areas better than quiet residential blocks."}
    building_condition: {weight: 5, why: "Large roofs are expensive to repair."}
    accessibility_transit: {weight: 3, why: "Transit helps non-driving members."}
    accessibility_ada: {weight: 3, why: "Public-facing facility must be accessible."}
    parking_requirement: {weight: 4, why: "Assembly/recreation uses often carry parking minimums."}
    conversion_risk: {weight: 3, why: "Showers and locker rooms add plumbing unknowns."}
    flood_risk: {weight: 4, why: "Large ground floors flood easily; flood zones add insurance cost and rules for major work."}
    evidence_quality: {weight: 0, why: "Shown for transparency; drives confidence, not the score."}

office:
  label: Office
  icon: briefcase
  keywords: [office, startup, agency, coworking, headquarters, firm, consultancy]
  zoning_use: office
  sizing: {sqft_per_seat: 0, default_sqft: 3000, ideal_min_sqft: 1000, ideal_max_sqft: 20000}
  program:
    drivers:
      - {field: employees, label: people, keywords: [employee, employees, people, person, staff, team, desk, desks, workstation, workstations, seat, seats], sqft_each: 175, base_sqft: 0, why: "~150-200 sq ft per person including meeting rooms, kitchen and circulation"}
    concepts:
      - id: office
        label: office
        default: true
        keywords: [office, headquarters, hq]
        sqft_per: {employees: [150, 175, 200]}
        default_count: {employees: 17}
        why: "A mix of desks and private offices with meeting rooms, kitchen and circulation."
      - id: open_plan
        label: open-plan office
        keywords: [startup, start-up, agency, coworking, co-working, open plan, open-plan, open office, tech company]
        sqft_per: {employees: [110, 140, 170]}
        default_count: {employees: 15}
        why: "Benching desks and shared rooms: ~110-170 sq ft per person."
      - id: professional
        label: professional office (private offices)
        keywords: [law firm, law office, attorney, lawyer, accounting, accountant, cpa, financial advisor, consultancy, firm, private offices]
        sqft_per: {employees: [200, 250, 300]}
        default_count: {employees: 10}
        why: "Mostly private offices, a reception and conference rooms: ~200-300 sq ft per person."
    occupancy:
      group: B
      load_factors:
        - {label: office, share: 1.0, sqft_per_person: 150}
    ground_floor: any
    min_ceiling_ft: 9
    ceiling_reason: Standard office ceilings.
    buildout_months: [2, 4]
  suitable_building_types: [commercial]
  costar_property_types: [Office, Flex, MixedUse, Healthcare]  # CoStar propertyType names that can host this use
  acceptable_building_types: [multiple_family, condo_apartment]
  default_radius_m: 800
  radius_reason: >-
    Office teams care about amenities and transit within a 10-minute walk (~800 m).
  place_roles:
    competitors: []
    demand: [food_drink, retail, lodging]
    access: [transit, parking]
  neighborhood:
    signals: [walk_access]
    benchmarks: {}
  metrics:
    occupancy_requirements: {weight: 3, why: "Headcount sets restroom count and whether one exit is enough."}
    permitted_use: {weight: 12, why: "Office use must be allowed at the address."}
    size_fit: {weight: 13, why: "Roughly 150-250 sq ft per employee."}
    accessibility_transit: {weight: 13, why: "Commute options shape hiring and retention."}
    occupancy_cost: {weight: 14, why: "Rent is usually the second-largest cost after payroll."}
    customer_demand: {weight: 8, why: "Here: nearby amenities (food, services) for staff and visitors."}
    building_condition: {weight: 8, why: "Roof and building condition affect tenant comfort and landlord risk."}
    accessibility_ada: {weight: 6, why: "Employees and visitors need accessible entry and restrooms."}
    onsite_parking: {weight: 7, why: "Staff parking is a recurring cost if not on site."}
    area_character: {weight: 6, why: "A professional commercial setting supports clients and brand."}
    parking_requirement: {weight: 4, why: "Office parking minimums apply in many cities."}
    hvac_ventilation: {weight: 5, why: "Comfort cooling for dense occupancy."}
    interior_layout: {weight: 4, why: "Open vs. private offices drive build-out."}
    flood_risk: {weight: 4, why: "Flood zones add insurance cost and can disrupt operations."}
    evidence_quality: {weight: 0, why: "Shown for transparency; drives confidence, not the score."}

retail:
  label: Retail store
  icon: shopping-bag
  keywords: [retail, store, shop, boutique, showroom]
  zoning_use: retail
  sizing: {sqft_per_seat: 0, default_sqft: 2000, ideal_min_sqft: 800, ideal_max_sqft: 8000}
  program:
    drivers: []
    concepts:
      - id: general_retail
        label: retail store
        default: true
        keywords: [retail, store, shop]
        default_sqft: [1200, 2000, 3500]
        why: "sales floor plus ~20% stockroom"
      - id: boutique
        label: boutique
        keywords: [boutique, apparel, clothing, fashion, gift shop, gift, florist, flower shop, jewelry, jewellery, cosmetics, bookstore, book shop, vintage, thrift]
        default_sqft: [700, 1200, 1800]
        why: "a compact sales floor with a fitting room and small stockroom"
      - id: convenience
        label: convenience store / market
        keywords: [convenience, corner store, bodega, mini mart, minimart, market, grocery, deli, liquor store, pharmacy]
        default_sqft: [1500, 2500, 4000]
        why: "aisles, coolers along the walls and a stockroom"
      - id: showroom
        label: showroom
        keywords: [showroom, furniture, mattress, appliance, flooring, lighting store, car dealership]
        default_sqft: [2500, 4000, 7000]
        why: "large items on display need open floor"
    occupancy:
      group: M
      load_factors:
        - {label: sales floor, share: 0.8, sqft_per_person: 60}
        - {label: stockroom, share: 0.2, sqft_per_person: 300}
    ground_floor: required
    min_ceiling_ft: 10
    ceiling_reason: Fixtures, signage and merchandising read better with 10+ ft ceilings.
    buildout_months: [2, 4]
  suitable_building_types: [commercial]
  costar_property_types: [GeneralRetail, MixedUse, Flex, Office]  # CoStar propertyType names that can host this use
  acceptable_building_types: [multiple_family, condo_apartment]
  default_radius_m: 800
  radius_reason: >-
    Retail depends on foot traffic and co-tenancy within a short walk (~800 m) plus drive-by visibility.
  place_roles:
    competitors: [retail]
    demand: [food_drink, offices, lodging, residential_services, entertainment]
    access: [parking, transit]
  neighborhood:
    signals: [daytime_workers, residents, competitors, walk_access]
    competitors: {match: {shop: ["*"]}, kind_by: shop}
    benchmarks: {daytime_workers: {strong: 10000, weak: 2000}, employed_residents: {strong: 5000, weak: 1000}}
  metrics:
    occupancy_requirements: {weight: 3, why: "Sales-floor size sets occupant load, exits and restroom needs."}
    customer_demand: {weight: 15, why: "Foot traffic and nearby shoppers drive sales."}
    permitted_use: {weight: 12, why: "Retail use must be allowed at the address."}
    occupancy_cost: {weight: 13, why: "Rent per sq ft must fit expected sales per sq ft."}
    size_fit: {weight: 10, why: "Sales floor plus storage needs."}
    accessibility_transit: {weight: 10, why: "Customers must reach and park easily."}
    competition: {weight: 8, why: "Co-tenancy helps; direct duplicates hurt."}
    onsite_parking: {weight: 8, why: "Shoppers expect convenient parking."}
