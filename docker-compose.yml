# EagleEye: backend (FastAPI + agents) + frontend (Next.js).
#
#   codex login                              # once, on this machine (or use the ChatGPT/Codex app)
#   cp backend/.env.example backend/.env     # add VEXCEL_API_KEY (optional: OSM-only mode without it)
#   docker compose up --build                # http://localhost:3000
#
# LLM fallback chain (LLM_PROVIDERS in backend/.env): Codex CLI → Claude Code CLI → Ollama.
#  - Codex uses YOUR login, mounted from ~/.codex (override with CODEX_HOME_DIR=/path; read-write because
#    Codex refreshes its token there).
#  - Claude Code needs CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY in backend/.env,
#    because the macOS Keychain login isn't visible inside a container. Without it, it is skipped.
#  - Ollama runs on the host and is reached through host.docker.internal.
# See INSTALLATION.md.

name: turnkey-matchmaker

services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_PATH: /data/turnkey.db
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
      CODEX_HOME: /codex-home
      CODEX_BIN: codex   # the Linux CLIs inside the image (host CODEX_BIN/CLAUDE_BIN paths would not exist here)
      CLAUDE_BIN: claude
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes host.docker.internal work on Linux too
    volumes:
      - turnkey-data:/data
      - turnkey-lodes:/app/data   # Census LODES worker/resident data, downloaded once on first use
      - ${CODEX_HOME_DIR:-~/.codex}:/codex-home
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the backend through the published host port.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  turnkey-data:
  turnkey-lodes:
